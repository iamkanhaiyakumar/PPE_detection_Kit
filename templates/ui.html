<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Webcam Detection — PPE Detection Kit</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',system-ui,sans-serif;background:#030712;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;}

    /* Navbar */
    .navbar{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
      background:rgba(3,7,18,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:100;}
    .nav-logo{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:700;text-decoration:none;color:#f1f5f9;}
    .logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:1rem;}
    .gradient-text{background:linear-gradient(135deg,#6366f1,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .nav-links{display:flex;gap:12px;}
    .nav-links a{padding:10px 20px;border-radius:10px;font-size:.9rem;font-weight:600;text-decoration:none;color:#94a3b8;transition:all .3s;border:1px solid transparent;}
    .nav-links a:hover{color:#f1f5f9;background:rgba(255,255,255,0.05);}
    .nav-links .active{background:linear-gradient(135deg,#6366f1,#06b6d4);color:#fff;border-color:transparent;}

    /* Main Content */
    .main-content{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 24px;}
    .page-header{text-align:center;margin-bottom:32px;}
    .page-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:50px;font-size:.8rem;font-weight:600;
      background:rgba(34,197,94,0.15);color:#22c55e;border:1px solid rgba(34,197,94,0.3);margin-bottom:16px;}
    .page-badge .pulse{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.5);}}
    .page-header h1{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:800;margin-bottom:8px;}
    .page-header p{color:#94a3b8;font-size:1rem;}

    /* Video Container */
    .video-wrapper{width:100%;max-width:960px;border-radius:20px;overflow:hidden;
      background:rgba(15,23,42,0.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 0 60px rgba(99,102,241,0.1);}
    .video-toolbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.08);}
    .video-title{display:flex;align-items:center;gap:10px;font-weight:600;}
    .status-dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px rgba(34,197,94,0.5);animation:pulse 2s infinite;}
    .video-controls{display:flex;gap:8px;}
    .ctrl-dot{width:14px;height:14px;border-radius:50%;}
    .video-frame{padding:16px;}
    .video-frame img{width:100%;border-radius:12px;display:block;}

    /* Footer */
    .page-footer{text-align:center;padding:24px;color:#64748b;font-size:.85rem;border-top:1px solid rgba(255,255,255,0.08);margin-top:auto;}

    /* Audio alert */
    @media(max-width:768px){
      .nav-links a{padding:8px 14px;font-size:.8rem;}
      .page-header h1{font-size:1.5rem;}
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="{{ url_for('home') }}" class="nav-logo">
      <div class="logo-icon">🛡️</div>
      <span>PPE Detection <span class="gradient-text">Kit</span></span>
    </a>
    <div class="nav-links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('front') }}">Video/Image</a>
      <a href="{{ url_for('webcam') }}" class="active">Live Webcam</a>
    </div>
  </nav>

  <!-- Main -->
  <div class="main-content">
    <div class="page-header">
      <div class="page-badge"><span class="pulse"></span> Live Detection Active</div>
      <h1>Webcam PPE <span class="gradient-text">Detection</span></h1>
      <p>Real-time safety monitoring using your webcam — powered by YOLOv8</p>
    </div>

    <div class="video-wrapper">
      <div class="video-toolbar">
        <div class="video-title">
          <span class="status-dot"></span>
          Live Webcam Feed
        </div>
        <div class="video-controls">
          <span class="ctrl-dot" style="background:#ef4444;"></span>
          <span class="ctrl-dot" style="background:#fbbf24;"></span>
          <span class="ctrl-dot" style="background:#22c55e;"></span>
        </div>
      </div>
      <div class="video-frame">
        <img src="{{ url_for('webapp') }}" alt="Live Webcam PPE Detection Output">
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="page-footer">
    &copy; <span id="year"></span> PPE Detection Kit. Developed by <strong>Kanhaiya Kumar</strong>
  </div>

  <!-- Alert Sound -->
  <audio id="alertSound" src="{{ url_for('static', filename='alert.mp3') }}"></audio>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const alertSound = document.getElementById('alertSound');
    let isPlaying = false;

    setInterval(function() {
      fetch('/alert_status')
        .then(r => r.json())
        .then(data => {
          if (data.alert && !isPlaying) {
            alertSound.loop = true;
            alertSound.play();
            isPlaying = true;
          }
          if (!data.alert && isPlaying) {
            alertSound.pause();
            alertSound.currentTime = 0;
            isPlaying = false;
          }
        }).catch(() => {});
    }, 1000);
  </script>
</body>
</html>
